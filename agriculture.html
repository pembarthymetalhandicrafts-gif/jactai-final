<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JactAI - Smart Farming</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Simple styling for the form */
        .ai-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 2rem;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 600px;
            margin: 2rem auto;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #22c55e; /* Green for Agriculture */
            color: black;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
        }
        button:hover { background: #16a34a; }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #111;
            border-radius: 8px;
            min-height: 50px;
            white-space: pre-wrap; /* Keeps formatting */
            display: none; /* Hidden until we have an answer */
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">JactAI</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="real-estate.html">Real Estate</a>
            <a href="agriculture.html" class="active">Agriculture</a>
        </div>
    </nav>

    <header class="hero">
        <div class="container">
            <h1>AI Agriculture Advisor 🌾</h1>
            <p>Get instant advice on crops, diseases, and fertilizers.</p>
            
            <div class="ai-box">
                <input type="text" id="cropInput" placeholder="Enter Crop Name (e.g., Rice, Cotton)">
                <input type="text" id="issueInput" placeholder="What is the issue? (e.g., Yellow leaves, Pest attack)">
                
                <button onclick="askAgricultureAI()" id="btn">Get Advice</button>
                
                <div id="result"></div>
            </div>
        </div>
    </header>

    <script>
        async function askAgricultureAI() {
            const crop = document.getElementById('cropInput').value;
            const issue = document.getElementById('issueInput').value;
            const btn = document.getElementById('btn');
            const resultBox = document.getElementById('result');

            if (!crop || !issue) {
                alert("Please enter both a crop and an issue.");
                return;
            }

            // 1. Show Loading State
            btn.innerText = "AI is Thinking... 🌱";
            btn.disabled = true;
            resultBox.style.display = "block";
            resultBox.innerText = "Consulting agricultural database...";

            // 2. Prepare the Question
            const promptText = `Act as an expert Indian Agriculture Consultant. 
            I am a farmer growing '${crop}'. 
            My problem is: '${issue}'. 
            Provide a short, practical solution with specific fertilizer or pesticide names if needed. 
            Keep it under 100 words.`;

            try {
                // 3. Call the Brain (api/generate)
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText })
                });

                const data = await response.json();

                // 4. Show Answer
                if (data.error) {
                    resultBox.innerText = "Error: " + data.error;
                } else {
                    resultBox.innerText = data.output;
                }
            } catch (error) {
                resultBox.innerText = "Network Error. Please try again.";
            }

            // 5. Reset Button
            btn.innerText = "Get Advice";
            btn.disabled = false;
        }
    </script>
</body>
</html>
